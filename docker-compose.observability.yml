services:
  prometheus: { image: prom/prometheus:v3.0.0, volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./observability/alerts.yml:/etc/prometheus/alerts.yml:ro", "prometheus-data:/prometheus"], ports: ["9090:9090"] }
  alertmanager: { image: prom/alertmanager:v0.28.0, volumes: ["./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"], ports: ["9093:9093"] }
  grafana: { image: grafana/grafana:11.4.0, volumes: ["./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/fileexpress.yml:ro", "./observability/grafana-dashboard.json:/var/lib/grafana/dashboards/fileexpress.json:ro", "grafana-data:/var/lib/grafana"], ports: ["3001:3000"], environment: { GF_AUTH_ANONYMOUS_ENABLED: "false", GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?required}" } }
  loki: { image: grafana/loki:3.3.0, command: -config.file=/etc/loki/loki.yml, volumes: ["./observability/loki.yml:/etc/loki/loki.yml:ro", "loki-data:/loki"], ports: ["3100:3100"] }
  tempo: { image: grafana/tempo:2.7.0, command: -config.file=/etc/tempo/tempo.yml, volumes: ["./observability/tempo.yml:/etc/tempo/tempo.yml:ro", "tempo-data:/var/tempo"], ports: ["3200:3200"] }
  otel-collector: { image: otel/opentelemetry-collector-contrib:0.117.0, command: --config=/etc/otelcol/config.yml, volumes: ["./observability/otel-collector.yml:/etc/otelcol/config.yml:ro"], ports: ["4317:4317", "4318:4318", "8889:8889"] }
volumes: { prometheus-data: {}, grafana-data: {}, loki-data: {}, tempo-data: {} }
