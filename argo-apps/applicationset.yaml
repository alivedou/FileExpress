apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fileexpress
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - environment: dev
            revision: main
            chart: helm/fileexpress
          - environment: staging
            revision: main
            chart: helm/fileexpress
  template:
    metadata:
      name: "fileexpress-{{.environment}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/alivedou/FileExpress.git
        targetRevision: "{{.revision}}"
        path: "{{.chart}}"
        helm:
          valueFiles:
            - "values-{{.environment}}.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: "fileexpress-{{.environment}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
