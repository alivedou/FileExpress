apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fileexpress-prod
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - environment: prod
            revision: stable
            chart: helm/fileexpress-canary
  template:
    metadata:
      name: "fileexpress-{{.environment}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/alivedou/FileExpress.git
        targetRevision: "{{.revision}}"
        path: "{{.chart}}"
        helm:
          valueFiles:
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "fileexpress-{{.environment}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
