services:
  file-express:
    build: .
    container_name: file-express-app
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      APP_NAME: "${APP_NAME:-File Express}"
      APP_SUBTITLE: "${APP_SUBTITLE:-极简、安全、临时的文件传输中心}"
      MAX_SINGLE_FILE_SIZE_MB: "${MAX_SINGLE_FILE_SIZE_MB:-10}"
      MAX_ZIP_PAYLOAD_SIZE_MB: "${MAX_ZIP_PAYLOAD_SIZE_MB:-50}"
      MAX_TOTAL_STORAGE_MB: "${MAX_TOTAL_STORAGE_MB:-1024}"
      MAX_STORAGE_HOURS: "${MAX_STORAGE_HOURS:-24}"
      MAX_DOWNLOADS: "${MAX_DOWNLOADS:-100}"
      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
      STORAGE_BACKENDS: "${STORAGE_BACKENDS:-local}"
      MAX_CHUNK_SIZE_MB: "${MAX_CHUNK_SIZE_MB:-8}"
      MAX_CONCURRENT_CHUNKS: "${MAX_CONCURRENT_CHUNKS:-3}"
      UPLOAD_EXPIRY_HOURS: "${UPLOAD_EXPIRY_HOURS:-24}"
      STORAGE_ENCRYPTION_KEY: "${STORAGE_ENCRYPTION_KEY:?STORAGE_ENCRYPTION_KEY must be injected}"
      WEBHOOK_SIGNING_SECRET: "${WEBHOOK_SIGNING_SECRET:?WEBHOOK_SIGNING_SECRET must be injected}"
      ADMIN_API_TOKEN: "${ADMIN_API_TOKEN:?ADMIN_API_TOKEN must be injected}"
    volumes:
      - fileexpress-data:/data

volumes:
  fileexpress-data:
