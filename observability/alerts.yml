groups:
  - name: fileexpress
    rules:
      - alert: DiskUsageHigh
        expr: storage_usage_pct > 80
        for: 5m
        labels: { severity: warning }
        annotations: { summary: Storage usage exceeds 80% }
      - alert: ScanQueueBacklog
        expr: scan_queue_depth > 100
        for: 5m
        labels: { severity: warning }
      - alert: ErrorRateHigh
        expr: sum(rate(errors_total[5m])) / clamp_min(sum(rate(http_req_duration_seconds_count[5m])), 1) > 0.05
        for: 2m
        labels: { severity: critical }
      - alert: LatencyP99High
        expr: histogram_quantile(0.99, sum(rate(http_req_duration_seconds_bucket[5m])) by (le)) > 5
        for: 5m
        labels: { severity: warning }
      - alert: StorageBackendDown
        expr: storage_backend_healthy < 1
        for: 1m
        labels: { severity: critical }
