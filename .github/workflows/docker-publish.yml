name: 🐳 Manual Publish Docker Image

on:
  # 支持手动触发构建
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像版本号 (留空则只打 latest)'
        required: false
      push_to_registry:
        description: '是否直接推送到 GitHub 镜像仓库 (GHCR)'
        type: boolean
        required: true
        default: true

# 声明 GITHUB_TOKEN 的最小安全权限
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 拉取代码 (Checkout Repository)
        uses: actions/checkout@v4

      - name: ⚙️ 设置 QEMU 仿真环境 (用于跨系统架构编译 ARM/AMD)
        uses: docker/setup-qemu-action@v3

      - name: ⚙️ 设置 Docker Buildx (构建扩展引擎)
        uses: docker/setup-buildx-action@v3

      - name: 🔑 登录到 GitHub Container Registry (GHCR)
        if: ${{ github.event.inputs.push_to_registry == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ 生成镜像元数据及小写名称提取
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          if [ -n "$IMAGE_TAG" ]; then
            echo "tags=ghcr.io/${OWNER_LOWER}/${REPO_LOWER}:${IMAGE_TAG}"$'\n'"ghcr.io/${OWNER_LOWER}/${REPO_LOWER}:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=ghcr.io/${OWNER_LOWER}/${REPO_LOWER}:latest" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 编译并生成 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          # 多平台编译支持。你可以按需选择同时打包 amd64 主机(多数云服务器) 和 arm64 (Mac M系列或鲲鹏云服务器)
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push_to_registry == 'true' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
          # 开启构建缓存，极大程度加快下一次手动打包的速率
          cache-from: type=gha
          cache-to: type=gha,mode=max
