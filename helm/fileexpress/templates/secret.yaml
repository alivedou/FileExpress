{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: fileexpress
  labels:
    {{- include "fileexpress.labels" . | nindent 4 }}
type: Opaque
stringData:
  STORAGE_ENCRYPTION_KEY: {{ required "STORAGE_ENCRYPTION_KEY must come from an external secret or values override" .Values.secrets.STORAGE_ENCRYPTION_KEY | quote }}
  WEBHOOK_SIGNING_SECRET: {{ required "WEBHOOK_SIGNING_SECRET must come from an external secret or values override" .Values.secrets.WEBHOOK_SIGNING_SECRET | quote }}
  ADMIN_API_TOKEN: {{ required "ADMIN_API_TOKEN must come from an external secret or values override" .Values.secrets.ADMIN_API_TOKEN | quote }}
{{- end }}
