apiVersion: apps/v1
kind: Deployment
metadata:
  name: fileexpress
  labels:
    {{- include "fileexpress.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: fileexpress } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: fileexpress, app.kubernetes.io/instance: {{ .Release.Name }} }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "3000" }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: fileexpress
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 3000 }]
          envFrom: [{ configMapRef: { name: fileexpress } }, { secretRef: { name: {{ default "fileexpress" .Values.secrets.existingSecret }} } }]
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10, timeoutSeconds: 3 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /data }, { name: tmp, mountPath: /tmp }]
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}persistentVolumeClaim: { claimName: fileexpress }{{- else }}emptyDir: {}{{- end }}
        - { name: tmp, emptyDir: {} }
