apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: fileexpress
  labels:
    app.kubernetes.io/name: fileexpress
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: fileexpress
  strategy:
    canary:
      trafficRouting:
        nginx:
          stableIngress: fileexpress
      steps:
        - setWeight: 10
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: fileexpress-error-rate
        - setWeight: 50
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: fileexpress-error-rate
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fileexpress
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: fileexpress
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: fileexpress
            - secretRef:
                name: "{{ .Values.secrets.existingSecret }}"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "{{ .Values.resources.requests.cpu }}"
              memory: "{{ .Values.resources.requests.memory }}"
            limits:
              cpu: "{{ .Values.resources.limits.cpu }}"
              memory: "{{ .Values.resources.limits.memory }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fileexpress
        - name: tmp
          emptyDir: {}
