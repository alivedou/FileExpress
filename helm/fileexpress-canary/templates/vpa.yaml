apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: fileexpress
spec:
  targetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: fileexpress
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: fileexpress
        controlledResources:
          - cpu
          - memory
        maxAllowed:
          cpu: "4"
          memory: 4Gi
