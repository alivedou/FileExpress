apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fileexpress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fileexpress
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector: {}
